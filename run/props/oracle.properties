db=oracle
driver=oracle.jdbc.driver.OracleDriver
conn=jdbc:oracle:thin:@//localhost:1521/ofbiz
user=bmsql
password=bmsql

// Database Size - 100MB per Warehouse
warehouses=10

// Build Database - Number of Worker for Data Generation - Set to Number of Warehouse
loadWorkers=2

// Load Testing - Number of Worker for Stress Testing the Database - Set to 2x Logical CPU Cores
terminals=10

// To run for specified minutes- runTxnsPerTerminal must equal zero
runMins=1

// To run specified transactions per terminal- runMins must equal zero
runTxnsPerTerminal=0
limitTxnsPerMin=10000000
terminalWarehouseFixed=false
useStoredProcedures=false

// Directory name to create for collecting detailed result data.
resultDirectory=my_result_%tY-%tm-%td_%tH%tM%tS
osCollectorScript=./misc/os_collector_linux.py
osCollectorInterval=1
//osCollectorSSHAddr=user@dbhost
//osCollectorDevices=net_eth0 blk_sda
